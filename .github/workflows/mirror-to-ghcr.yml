name: Mirror Docker Hub tags to GHCR

# One-off migration helper — delete once the Docker Hub migration is signed off.
#
# Copies tags this service already published to Docker Hub into its GHCR
# package WITHOUT REBUILDING, preserving each manifest digest exactly.
#
# Why digests matter: production pins the image as `vX.Y.Z@sha256:...`. A
# rebuild produces a new digest and invalidates that pin; a registry-to-registry
# copy keeps it valid, so repointing the chart at GHCR becomes a one-line change
# with no redeploy.
#
# Why this runs here instead of from a laptop: pushing with the repository's own
# GITHUB_TOKEN is what lets GitHub associate the new package with this repo, so
# it inherits repository access instead of becoming a standalone package whose
# permissions have to be configured by hand.
#
# Reads Docker Hub with the credentials that still exist today — RUN THIS BEFORE
# the shared Docker Hub credential is revoked.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Space-separated tags, or "all" to mirror every tag in the source repo'
        type: string
        default: 'all'
      dry_run:
        description: 'Resolve and report digests without writing to GHCR'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  SRC: docker.io/safeglobal/safe-cli
  DST: ghcr.io/safe-global/safe-cli
  CRANE_VERSION: v0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Install crane (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL -o crane.tgz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tgz" | sha256sum -c -
          tar -xzf crane.tgz crane
          sudo install -m 0755 crane /usr/local/bin/crane
          crane version

      - name: Log in to Docker Hub (source, read-only)
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKER_PASSWORD" | crane auth login docker.io -u "$DOCKER_USER" --password-stdin

      - name: Log in to GHCR (destination)
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Mirror tags
        env:
          # Inputs reach the script through the environment, never interpolated
          # into it.
          INPUT_TAGS: ${{ inputs.tags }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Every tag is mirrored, not just the live ones: this image is public on
          # Docker Hub, so anyone outside Safe may be pinning any published tag and
          # should find it on GHCR after the move.
          if [ "$INPUT_TAGS" = "all" ]; then
            mapfile -t TAGS < <(crane ls "$SRC")
            echo "discovered ${#TAGS[@]} tag(s): ${TAGS[*]}"
          else
            read -r -a TAGS <<< "$INPUT_TAGS"
          fi

          # GHCR throttles sustained blob writes and answers 403 rather than 429,
          # which crane treats as fatal and does not retry. Serialising the blob
          # operations keeps the write rate under the threshold, and retrying the
          # whole copy recovers if it is crossed anyway: blobs already uploaded
          # are skipped, so every attempt makes progress.
          copy_with_retry() {
            local src="$1" dst="$2" attempt=1 max=4 backoff
            while :; do
              if crane copy -j 1 "$src" "$dst"; then
                return 0
              fi
              if [ "$attempt" -ge "$max" ]; then
                return 1
              fi
              backoff=$((attempt * 20))
              echo "  attempt $attempt failed - retrying in ${backoff}s"
              sleep "$backoff"
              attempt=$((attempt + 1))
            done
          }

          {
            echo "### \`$SRC\` → \`$DST\`"
            echo
            echo "| tag | digest | result |"
            echo "| --- | ------ | ------ |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0

          for tag in "${TAGS[@]}"; do
            [ -n "$tag" ] || continue

            if ! src_digest=$(crane digest "$SRC:$tag" 2>/dev/null); then
              echo "FAIL  $tag — cannot read source manifest"
              echo "| \`$tag\` | | **failed** — unreadable source |" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "would copy  $tag  $src_digest"
              echo "| \`$tag\` | \`$src_digest\` | dry run |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Guarded: an unguarded failure would abort under `set -e` before the
            # summary row and the failure counter were written.
            if ! copy_with_retry "$SRC:$tag" "$DST:$tag"; then
              echo "FAIL  $tag - copy did not complete after retries"
              echo "| \`$tag\` | \`$src_digest\` | **failed** - copy error |" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
              continue
            fi

            dst_digest=$(crane digest "$DST:$tag")

            if [ "$src_digest" != "$dst_digest" ]; then
              echo "DIGEST MISMATCH on $tag"
              echo "  src $src_digest"
              echo "  dst $dst_digest"
              echo "| \`$tag\` | \`$src_digest\` | **DIGEST MISMATCH** |" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
              continue
            fi

            echo "ok    $tag  $src_digest"
            echo "| \`$tag\` | \`$src_digest\` | copied, digest preserved |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed tag(s) failed to mirror"
            exit 1
          fi
